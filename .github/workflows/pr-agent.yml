name: PR Agent

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, review_requested]
  issue_comment:
    types: [created]

jobs:
  pr-agent:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: mvaldes14/gh-actions/.github/workflows/pr-agent.yml@main
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
